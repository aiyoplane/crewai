[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiyoplane-crewai"
version = "1.0.1"
description = "AEAP Composition Boundary Adapter for CrewAI. Thin wrapper that attaches the Runtime Decision Point to CrewAI tool invocations."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Aiyoplane, Inc.", email = "rashon@aiyoplane.com"}]
requires-python = ">=3.10"
keywords = [
    "aiyo",
    "aiyoplane",
    "aeap",
    "crewai",
    "multi-agent",
    "authorization",
    "runtime-decision-point",
    "rdp",
    "execution-receipt",
    "composition-boundary",
    "agent-authorization",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiyoplane-mcp-authz>=1.0.1",
    "crewai>=0.70",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://aiyoplane.com"
Documentation = "https://github.com/aiyoplane/crewai"
Repository = "https://github.com/aiyoplane/crewai"
Issues = "https://github.com/aiyoplane/crewai/issues"
"Trust Surface" = "https://aiyoplane.com/trust"
"AEAP Specification" = "https://github.com/aiyoplane/aeap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiyoplane_crewai = ["py.typed"]
